name: Assemble V130

on:
  push:
    branches: [main]
    paths:
      - 'deploy/v130.ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble V130 index.html
        shell: bash
        run: |
          cat deploy/v130.part*.b64 | base64 -d | gzip -d > index.html
          echo "0a7c097005d7df1e0e82ce63d86f2eb1a89ae47979d9c5298d4ff479dbab5615  index.html" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already matches V130"
            exit 0
          fi
          git commit -m "Deploy V130: first 8 audit, no sketches"
          git push
